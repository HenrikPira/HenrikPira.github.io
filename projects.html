<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steam games</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #121212;
      min-height: 100vh;
      color: #fff;
      overflow-y: auto;
      animation: fadeIn 0.5s ease-in;
    }

    header {
      background: linear-gradient(to top, rgba(24, 24, 24, 0.199), #7e7e7e33);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    nav a {
      margin-left: 2rem;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #00adb5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.8rem;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    ul.game-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .game-item {
      background: rgba(46, 46, 46, 0.123);
      border-radius: 2px;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s;
    }

    .game-item:hover {
      transform: scale(1.02);
    }

    .game-title {
      font-size: 2.0rem;
      font-weight: bold;
      text-align: center;
    }

    .content-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .image-container {
      position: relative;
      width: 315px;
      height: 250px;
      flex-shrink: 0;
    }

    .game-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .static-image {
      z-index: 1;
    }

    .animated-image {
      opacity: 0;
      z-index: 2;
    }

    .game-item:hover .animated-image {
      opacity: 1;
    }

    .game-item:hover .static-image {
      opacity: 0;
    }

    
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .side-link {
      font-size: 1.3rem;
      opacity: 0.3;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .side-link:hover {
      opacity: 1;
    }

    .description {
      flex: 1;
      font-size: 1rem;
      opacity: 0.9;
      text-align: left;
    }

    a.game-item:hover .game-title,
    a.game-item:hover .description {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1><a href="index.html">Henrik Pira</a></h1>
    <nav>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="container">
    <div class="title-bar">
      <a href="jamGames.html" class="side-link">Game jams</a>
      <a href="steamGames.html" class="side-link">Steam games</a>
      <h1>Projects</h1>
    </div>

    <ul class="game-list" id="gameList"></ul>
  </div>

  <script>
    const projects = [
      {
        title: "Guitar 3D model",
        description: "Guitar made in Blender and Substance Painter. 2.9k triangles.",
        url: "https://sketchfab.com/3d-models/guitar-466e77ee8f5c4ceba27f2cb181b8b3bb",
        staticImg: "assets/guitar.png",
        animatedImg: "assets/guitarWire.png"
      }
    ];

    const gameList = document.getElementById("gameList");

    projects.forEach(game => {
      const li = document.createElement("li");

      li.innerHTML = `
        <a class="game-item" href="${game.url}" target="_blank" rel="noopener noreferrer">
          <div class="game-title">${game.title}</div>
          <div class="content-row">
            <div class="image-container">
              <img class="game-image static-image" src="${game.staticImg}" alt="${game.title} static">
              <img class="game-image animated-image" src="${game.animatedImg}" alt="${game.title} animated">
            </div>
            <div class="description">${game.description}</div>
          </div>
        </a>
      `;

      gameList.appendChild(li);
    });
  </script>

</body>
</html>
