<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --primary: #f1f1f1;
      --card-bg: #1e1e1e;
      --text:  #ccc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #121212;
      color: var(--primary);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(to top, rgba(24, 24, 24, 0.199), #7e7e7e33);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      margin-left: 2rem;
      color: var(--primary);
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #00adb5;
    }

    .hero {
      padding: 4rem 2rem 2rem;
      text-align: center;
    }

    .hero h2 {
      font-size: 2.8rem;
      font-weight: 600;
    }

    .hero p {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: var(--text);
    }

    .grid {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
      display: grid;
      gap: 2rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h3 {
      font-size: 1.2rem;
      padding: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: transparent;
      font-size: 0.9rem;
      color: var(--text);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1><a href="index.html">Henrik Pira</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Work</h2>
    <p>Games and projects</p>
  </section>

  <section class="grid">
    <div class="card" onclick="location.href='jamGames.html'">
      <img src="assets/temp.jpg" alt="Design Project">
      <h3>Game jams</h3>
    </div>

    <div class="card" onclick="location.href='steamGames.html'">
      <img src="assets/temp.jpg" alt="Development Project">
      <h3>Steam games</h3>
    </div>

    <div class="card" onclick="location.href='project3.html'">
      <img src="assets/temp.jpg" alt="Branding Project">
      <h3>temp</h3>
    </div>
  </section>

</body>
</html>
