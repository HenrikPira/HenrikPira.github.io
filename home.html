<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f9f9f9;
      --bg-dark: #121212;
      --primary-light: #222831;
      --primary-dark: #f1f1f1;
      --accent: #00adb5;
      --card-bg-light: #ffffff;
      --card-bg-dark: #1e1e1e;
      --text-light: #777;
      --text-dark: #ccc;
    }

    [data-theme="light"] {
      --bg: var(--bg-light);
      --primary: var(--primary-light);
      --card-bg: var(--card-bg-light);
      --text: var(--text-light);
    }

    [data-theme="dark"] {
      --bg: var(--bg-dark);
      --primary: var(--primary-dark);
      --card-bg: var(--card-bg-dark);
      --text: var(--text-dark);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--primary);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: transparent;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      margin-left: 2rem;
      color: var(--primary);
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent);
    }

    .toggle-btn {
      margin-left: 2rem;
      cursor: pointer;
      background: none;
      border: 1px solid var(--primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--primary);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .toggle-btn:hover {
      background: var(--primary);
      color: var(--bg);
    }

    .hero {
      padding: 4rem 2rem 2rem;
      text-align: center;
    }

    .hero h2 {
      font-size: 2.8rem;
      font-weight: 600;
    }

    .hero p {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: var(--text);
    }

    .grid {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
      display: grid;
      gap: 2rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h3 {
      font-size: 1.2rem;
      padding: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: transparent;
      font-size: 0.9rem;
      color: var(--text);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Henrik Pira</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <button class="toggle-btn" id="themeToggle">☀ Light Mode</button>
    </nav>
  </header>

  <section class="hero">
    <h2>Work</h2>
    <p>Games and projects</p>
  </section>

  <section class="grid">
    <div class="card" onclick="location.href='project1.html'">
      <img src="assets/temp.jpg" alt="Design Project">
      <h3>Game jams</h3>
    </div>

    <div class="card" onclick="location.href='project2.html'">
      <img src="assets/temp.jpg" alt="Development Project">
      <h3>Steam games</h3>
    </div>

    <div class="card" onclick="location.href='project3.html'">
      <img src="assets/temp.jpg" alt="Branding Project">
      <h3>temp</h3>
    </div>

  </section>

  <script>
    const toggleBtn = document.getElementById('themeToggle');
    const htmlTag = document.documentElement;

    // Set default theme on load
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      htmlTag.setAttribute('data-theme', 'light');
      toggleBtn.textContent = '🌙';
    } else {
      htmlTag.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '☀️';
    }

    toggleBtn.addEventListener('click', () => {
      const current = htmlTag.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      htmlTag.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });
  </script>

</body>
</html>
